rollout_steps: 512 # it's a single turn game, so we increase the rollout steps
rollout_iterations: 91
eval_frequency: 1
eval_episodes: 5
critic_epochs: 20
actor_epochs: 2
max_grad_norm: 0.5
critic_max_grad_norm: 4.0
tau: 0.1 # actual fn is 1-tau so our update is 0.9
num_workers: 1
gamma: 1
train_instances: "merged_instances.json"
eval_instances: "instances_v1.6_en.json"
eval_rollout_steps: 36
warmup_iters: 20
scale_reward: True
scaling_factor: 100.00
is_replay_buffer: True
step_size: 256
inference_batch_size: 256
actor_grad_accum_steps: 32
actor_batch_size: 8
critic_grad_accum_steps: 4
critic_batch_size: 64  # Increase batch size since it's single turn.
buffer_size: 7680 # 15x rollout steps.
save_every: 5
# make sure that step size, grad accum and batch sizes add up.